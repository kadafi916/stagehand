services:
  stagehand:
    build: .
    container_name: ${CONTAINER_NAME:-stagehand}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8088"
    volumes:
      - ${CONFIG_DIR:-~/.config/stagehand}:/root/.config/stagehand
      - ${TV_DIR:-/path/to/tv}:/tv
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-512M}
    # A hard CPU quota (deploy.resources.limits.cpus) needs CFS bandwidth
    # control, which Synology DSM kernels typically don't have compiled in.
    # cpu_shares is a relative priority instead of a hard cap -- it doesn't
    # need that kernel feature, and still keeps this from crowding out other
    # containers under contention (default share weight is 1024; lower value
    # here means lower priority).
    cpu_shares: ${CPU_SHARES:-512}
